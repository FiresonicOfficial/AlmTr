name: Android CI & Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Test Android App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.3.1'
          cache-read-only: false

      - name: Prepare Environment & Secrets
        run: |
          # Secrets Gradle Plugin expects .env file; copy from .env.example if missing
          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          fi
          # Restore debug keystore if present in repo
          if [ -f debug.keystore.base64 ] && [ ! -f debug.keystore ]; then
            base64 -d debug.keystore.base64 > debug.keystore || true
          fi
          # Ensure gradlew executable if present
          if [ -f gradlew ]; then
            chmod +x gradlew
          fi

      - name: Run Unit Tests
        run: |
          if [ -f gradlew ]; then
            ./gradlew testDebugUnitTest --no-daemon --stacktrace
          else
            gradle testDebugUnitTest --no-daemon --stacktrace
          fi

      - name: Build Debug APK
        run: |
          if [ -f gradlew ]; then
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            gradle assembleDebug --no-daemon --stacktrace
          fi

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore

      - name: Upload Debug APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: WortMeister-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
